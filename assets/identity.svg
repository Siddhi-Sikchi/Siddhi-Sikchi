<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1100 420"
     width="1100"
     height="420"
     role="img"
     aria-label="Siddhi Sikchi developer profile">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090707"/>
      <stop offset="50%" stop-color="#160F12"/>
      <stop offset="100%" stop-color="#0A0809"/>
    </linearGradient>

    <!-- Card glow -->
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#A27D95" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#A27D95" stop-opacity="0"/>
    </radialGradient>

    <!-- Accent -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#634A58"/>
      <stop offset="50%" stop-color="#C4A3B8"/>
      <stop offset="100%" stop-color="#634A58"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="softGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip -->
    <clipPath id="card">
      <rect x="25" y="25" width="1050" height="370" rx="24"/>
    </clipPath>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1100"
        height="420"
        fill="url(#bg)"/>

  <!-- Ambient lights -->

  <circle cx="900"
          cy="100"
          r="230"
          fill="url(#glow)"/>

  <circle cx="180"
          cy="350"
          r="180"
          fill="url(#glow)"/>


  <!-- ================================================= -->
  <!-- MAIN CARD -->
  <!-- ================================================= -->

  <rect x="25"
        y="25"
        width="1050"
        height="370"
        rx="24"
        fill="#120B0E"
        stroke="#30382A"
        stroke-width="1.5"/>


  <!-- ================================================= -->
  <!-- DECORATIVE CORNERS -->
  <!-- ================================================= -->

  <path d="M55 95 V55 H95"
        fill="none"
        stroke="#A27D95"
        stroke-width="2"/>

  <path d="M1005 325 V365 H965"
        fill="none"
        stroke="#A27D95"
        stroke-width="2"/>


  <!-- ================================================= -->
  <!-- LEFT IDENTITY AREA -->
  <!-- ================================================= -->

  <g clip-path="url(#card)">

    <!-- vertical line -->

    <line x1="82"
          y1="105"
          x2="82"
          y2="330"
          stroke="#44323D"
          stroke-width="1"/>


    <!-- glowing point -->

    <circle cx="82"
            cy="105"
            r="5"
            fill="#C4A3B8"
            filter="url(#softGlow)">

      <animate attributeName="opacity"
               values="1;.3;1"
               dur="2.5s"
               repeatCount="indefinite"/>

    </circle>


    <!-- Small label -->

    <text x="112"
          y="83"
          fill="#634A58"
          font-family="Courier New, monospace"
          font-size="11"
          letter-spacing="4">

      PROFILE / 2026

    </text>


    <!-- Main title -->

    <text x="112"
          y="135"
          fill="#FFFFFF"
          font-family="Trebuchet MS, Segoe UI, sans-serif"
          font-size="38"
          font-weight="bold"
          letter-spacing="2">

      COMPUTER ENGINEERING

    </text>


    <!-- Subtitle -->

    <text x="112"
          y="168"
          fill="#A27D95"
          font-family="Courier New, monospace"
          font-size="14"
          letter-spacing="2">

      SOFTWARE DEVELOPMENT + AI / ML

    </text>


    <!-- Thought -->

    <text x="112"
          y="215"
          fill="#C4A3B8"
          font-family="Georgia, serif"
          font-size="19"
          font-style="italic">

      "Build with purpose. Learn with curiosity.

    </text>

    <text x="112"
          y="242"
          fill="#C4A3B8"
          font-family="Georgia, serif"
          font-size="19"
          font-style="italic">

      Turn ideas into useful software."

    </text>


    <!-- Small animated underline -->

    <rect x="112"
          y="260"
          width="190"
          height="2"
          fill="url(#accent)">

      <animate attributeName="width"
               values="40;190;40"
               dur="4s"
               repeatCount="indefinite"/>

    </rect>


    <!-- ================================================= -->
    <!-- EDUCATION -->
    <!-- ================================================= -->

    <text x="112"
          y="302"
          fill="#634A58"
          font-family="Courier New, monospace"
          font-size="10"
          letter-spacing="3">

      EDUCATION

    </text>


    <text x="112"
          y="326"
          fill="#FFFFFF"
          font-family="Trebuchet MS, Segoe UI, sans-serif"
          font-size="15"
          font-weight="bold">

      Vishwakarma Institute of Technology, Pune

    </text>


    <text x="112"
          y="349"
          fill="#805F72"
          font-family="Courier New, monospace"
          font-size="11">

      B.Tech • Computer Engineering • 3rd Year

    </text>


    <!-- ================================================= -->
    <!-- RIGHT STATS -->
    <!-- ================================================= -->

    <!-- vertical divider -->

    <line x1="700"
          y1="80"
          x2="700"
          y2="340"
          stroke="#30382A"
          stroke-width="1"/>


    <!-- CGPA -->

    <g>

      <text x="750"
            y="105"
            fill="#634A58"
            font-family="Courier New, monospace"
            font-size="10"
            letter-spacing="3">

        ACADEMIC

      </text>

      <text x="750"
            y="160"
            fill="#C4A3B8"
            font-family="Trebuchet MS, Segoe UI, sans-serif"
            font-size="48"
            font-weight="bold">

        8.85

      </text>

      <text x="750"
            y="184"
            fill="#634A58"
            font-family="Courier New, monospace"
            font-size="11"
            letter-spacing="2">

        CGPA / 10

      </text>

    </g>


    <!-- Leetcode -->

    <g>

      <text x="750"
            y="230"
            fill="#634A58"
            font-family="Courier New, monospace"
            font-size="10"
            letter-spacing="3">

        PROBLEM SOLVING

      </text>

      <text x="750"
            y="282"
            fill="#FFFFFF"
            font-family="Trebuchet MS, Segoe UI, sans-serif"
            font-size="40"
            font-weight="bold">

        100+

      </text>

      <text x="750"
            y="304"
            fill="#634A58"
            font-family="Courier New, monospace"
            font-size="11"
            letter-spacing="2">

        PROBLEMS SOLVED

      </text>

    </g>


    <!-- Status -->

    <g>

      <circle cx="754"
              cy="337"
              r="4"
              fill="#A27D95"
              filter="url(#softGlow)">

        <animate attributeName="opacity"
                 values="1;.2;1"
                 dur="1.8s"
                 repeatCount="indefinite"/>

      </circle>

      <text x="768"
            y="341"
            fill="#805F72"
            font-family="Courier New, monospace"
            font-size="10"
            letter-spacing="2">

        ALWAYS LEARNING

      </text>

    </g>


    <!-- ================================================= -->
    <!-- MOVING LIGHT -->
    <!-- ================================================= -->

    <rect x="25"
          y="392"
          width="180"
          height="2"
          fill="url(#accent)"
          opacity=".8">

      <animate attributeName="x"
               values="25;895;25"
               dur="7s"
               repeatCount="indefinite"/>

    </rect>

  </g>

</svg>